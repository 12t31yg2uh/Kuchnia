<head>

    <title>Ćwiczenia Fizyczne - Plany i Rozpiski</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
        }
        .content {
            margin: 20px auto;
            max-width: 900px;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .exercise-category {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .exercise-category div {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            width: 30%;
            cursor: pointer;
        }
        .exercise-category div:hover {
            background-color: #45a049;
        }
        .exercise-list {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .exercise-item {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 10px;
            padding: 15px;
            width: 45%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .exercise-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        footer {
            margin-top: 30px;
            padding: 10px 0;
            background: #333;
            color: white;
            font-size: 14px;
        }
        .newsletter {
            margin-top: 20px;
        }
        .newsletter input[type="email"] {
            padding: 10px;
            border-radius: 5px;
            width: 250px;
        }
        .newsletter input[type="submit"] {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .newsletter input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
